name: Compila APK Flutter
on: [workflow_dispatch] # Ti permette di avviarlo premendo un bottone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Installa dipendenze e Compila APK
        run: |
          flutter pub get
          flutter build apk --debug
          
      - name: Carica APK nei download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
