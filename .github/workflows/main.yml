name: Compila APK Flutter
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Versione che soddisfa il requisito Dart SDK ^3.5.0
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Risoluzione conflitti e Build
        run: |
          # Forza l'aggiornamento del pacchetto problematico direttamente nel pubspec
          sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^10.7.0/g' pubspec.yaml
          
          flutter pub get
          flutter clean
          flutter pub get
          flutter build apk --debug
          
      - name: Carica APK nei download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
