name: Compila APK Flutter
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Risoluzione conflitti e Build
        run: |
          # 1. Aggiorna il pacchetto delle icone nel pubspec
          sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^10.7.0/g' pubspec.yaml
          
          # 2. Risolve radicalmente il problema del Manifest dicendo a Gradle di accettare l'override
          # Iniettiamo la regola "tools:replace" direttamente nella struttura principale dell'app
          cat << EOF > android/app/src/debug/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="com.example.nothing_clock">
              <application tools:replace="android:label">
                  <receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver"
                      tools:replace="android:enabled"
                      android:enabled="true"
                      android:exported="false">
                  </receiver>
              </application>
          </manifest>
          EOF

          # 3. Aggiorna compileSdkVersion a 35 come richiesto da audioplayers_android (Righe 46-52 del tuo log)
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle

          # 4. Avvia la compilazione pulita
          flutter pub get
          flutter clean
          flutter pub get
          flutter build apk --debug
          
      - name: Carica APK nei download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
