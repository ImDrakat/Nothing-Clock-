name: Compila APK Flutter
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04 # Forza l'uso di una versione specifica e stabile di Ubuntu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: . # Ottimizza il download per evitare conflitti di Node

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Cambiato in Temurin, più stabile sulle nuove macchine GitHub
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Attiva la cache per velocizzare le prossime compilazioni
          
      - name: Installa dipendenze e Compila APK
        run: |
          flutter pub get
          flutter build apk --debug --pub
          
      - name: Carica APK nei download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          
