name: Compila APK Flutter
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Risoluzione conflitti e Build
        run: |
          # 1. Aggiorna il pacchetto delle icone nel pubspec
          sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^10.7.0/g' pubspec.yaml
          
          # 2. Corregge il Manifest inserendo gli strumenti di override (tools)
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android" xmlns:tools="http:\/\/schemas.android.com\/tools"/g' android/app/src/main/AndroidManifest.xml
          
          # 3. Forzza l'override del ricevitore dell'allarme per risolvere il Manifest Merger
          sed -i 's/<receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver"/<receiver android:name="dev.fluttercommunity.plus.androidalarmmanager.RebootBroadcastReceiver" tools:replace="android:enabled"/g' android/app/src/main/AndroidManifest.xml

          # 4. Avvia la compilazione pulita
          flutter pub get
          flutter clean
          flutter pub get
          flutter build apk --debug
          
      - name: Carica APK nei download
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
